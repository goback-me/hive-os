# Fully self-contained — lives entirely in this folder, doesn't touch
# your main /root/docker-compose.yml at all. The only thing it shares
# with your existing stack is the external `root_default` network, so
# Traefik (already running as part of your main stack) can see and
# route to this container. Everything else — Postgres, volumes, the
# app itself — is isolated to this project.
#
# This is named docker-compose.prod.yml (not docker-compose.yml) so it
# never collides with your local Windows dev compose file of the same
# repo. Always run it with -f, or use deploy.sh which does that for you.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hive_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hive_os
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hive_os
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    networks:
      - internal
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hive-os.rule=Host(`portal.hivesocial.agency`)"
      - "traefik.http.routers.hive-os.entrypoints=web,websecure"
      - "traefik.http.routers.hive-os.tls=true"
      - "traefik.http.routers.hive-os.tls.certresolver=mytlschallenge"
      - "traefik.http.services.hive-os.loadbalancer.server.port=3000"

volumes:
  pg_data:

networks:
  internal:
  root_default:
    external: true