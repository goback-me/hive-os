# The only compose file for this project. Self-contained: own Postgres,
# own volume, own internal network. The only thing shared with your
# existing VPS stack is the `root_default` external network, so Traefik
# (already running as part of your main stack) can route to this app.
#
# Reads everything from a single `.env` file in this same folder —
# docker-compose auto-loads .env for variable substitution (${...} below)
# and the app service also loads it at runtime via `env_file`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hive_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hive_os
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hive_os
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - internal
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hive-os.rule=Host(`portal.hivesocial.agency`)"
      - "traefik.http.routers.hive-os.entrypoints=web,websecure"
      - "traefik.http.routers.hive-os.tls=true"
      - "traefik.http.routers.hive-os.tls.certresolver=mytlschallenge"
      - "traefik.http.services.hive-os.loadbalancer.server.port=3000"

volumes:
  pg_data:

networks:
  internal:
  root_default:
    external: true
